version: '3'

services:
  my-postgres:
    image: postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  virtuoso:
    image: openlink/virtuoso-opensource-7:latest
    environment:
      - DBA_PASSWORD=dba
      - SPARQL_UPDATE=true
      - DEFAULT_GRAPH=http://example.com/sotis
    ports:
      - "8890:8890"
    volumes:
      - virtuoso_data:/data
      - ./virtuoso.ini:/data/virtuoso.ini
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/sparql"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  virtuoso_data: